<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css">
    <title>Busca-Serie</title>
  </head>
  <body>
    <header>
      <h1>Busca-Serie</h1>
      <p>Encuentra tu serie favorita</p>
    </header>

    <main>
      <div>
        <p>Nombre de la serie:</p>
        <div>
          <input id="nombre-serie" type="text"/>
          <button id="boton-busqueda">Buscar</button>
        </div>
      </div>

      <section>
          <h2>Filtrar resultados</h2>
          <label>Género</label>
          <select id="filtro-genero">
            <option></option>
          </select>
      </section>

      <p id="contador-resultados"></p>

      <div id="resultados"></div>
    </main>

    <footer>
      <p>La API usada es de <a href="https://www.tvmaze.com/">TVmaze</a></p>
    </footer>




    <script type="module" src="/src/main.js"></script>
  </body>
</html>
